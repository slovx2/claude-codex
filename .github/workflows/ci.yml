name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --global @openai/codex@0.147.0 --no-audit --no-fund
      - run: codex app-server generate-json-schema --experimental --out .artifacts/schema
      - run: CODEX_REAL="$(command -v codex)" npm run check:rust-protocol-fixtures
      - run: npm run check       # biome format + lint
      - run: npm run typecheck   # tsc --noEmit
      - run: npm test
        env:
          CODEX_SCHEMA_DIR: ${{ github.workspace }}/.artifacts/schema
      - name: Real SDK and local Mock LLM protocol contract
        run: npm run test:protocol
        env:
          CODEX_SCHEMA_DIR: ${{ github.workspace }}/.artifacts/schema
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: claude-protocol-evidence
          path: .artifacts/protocol
          if-no-files-found: error

  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo test --workspace --locked
